identity:
  ai_name: "Kairos"
  user_name: "挽挽"
  user_display_name: "挽挽"
  user_aliases: ["宝宝", "老婆", "小猫"]

embedding:
  enabled: true
  model: "Qwen/Qwen3-Embedding-0.6B"
  base_url: "https://api.siliconflow.cn/v1"

gateway:
  default_session: "main"
  skip_recent_rounds: 5
  cooldown_hours: 6
  upstreams:
    - name: "deepseek"
      base_url: "https://api.deepseek.com"
      api_key_env: "OMBRE_GATEWAY_DEEPSEEK_API_KEY"
      models:
        - "deepseek-chat"

dream:
  enabled: true
  auto_enabled: true
  model: "deepseek-chat"
  base_url: "https://api.deepseek.com"
  thinking_mode: "disabled"
  timezone: "Asia/Shanghai"
  daily_hour: 3
  daily_probability: 0.4
  min_material_count: 5
  material_window_hours: 48
